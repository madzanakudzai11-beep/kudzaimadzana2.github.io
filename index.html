<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">

<style id="page-style">
:root{
  --ground:#f2f1ec;
  --surface:#e8e7e0;
  --ink:#171a17;
  --mute:#6b6f6a;
  --line:rgba(23,26,23,.14);
  --hair:rgba(23,26,23,.08);
  --accent:#0d6b4f;
  --accent-soft:rgba(13,107,79,.11);
  --focus:#0d6b4f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101210;
    --surface:#191c19;
    --ink:#eceee9;
    --mute:#969b95;
    --line:rgba(236,238,233,.16);
    --hair:rgba(236,238,233,.08);
    --accent:#43c795;
    --accent-soft:rgba(67,199,149,.14);
    --focus:#43c795;
  }
}
:root[data-theme="dark"]{
  --ground:#101210;
  --surface:#191c19;
  --ink:#eceee9;
  --mute:#969b95;
  --line:rgba(236,238,233,.16);
  --hair:rgba(236,238,233,.08);
  --accent:#43c795;
  --accent-soft:rgba(67,199,149,.14);
  --focus:#43c795;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
  font-size:17px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  transition:background .3s ease,color .3s ease;
}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{
  outline:2px solid var(--focus);outline-offset:3px;border-radius:2px;
}
::selection{background:var(--accent-soft)}

.wrap{max-width:1080px;margin:0 auto;padding:0 28px}

/* ---------- masthead ---------- */
.masthead{
  position:sticky;top:0;z-index:50;
  background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--hair);
}
.masthead .wrap{
  display:flex;align-items:center;gap:24px;
  height:58px;
}
.mark{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:800;letter-spacing:-.02em;font-size:16px;
}
.mast-nav{margin-left:auto;display:flex;gap:22px;align-items:center}
.mast-nav a,.ghost{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);
}
.mast-nav a:hover,.ghost:hover{color:var(--accent)}
.ghost{background:none;border:0;padding:0;cursor:pointer;font-family:"JetBrains Mono",ui-monospace,monospace}
@media(max-width:720px){.mast-nav a[data-optional]{display:none}}

/* ---------- hero ---------- */
.hero{position:relative;padding:96px 0 78px;overflow:hidden}
.hero-inner{position:relative;z-index:1;max-width:760px}
.portrait{
  position:absolute;
  right:10px;
  top:46%;
  transform:translateY(-50%);
  width:clamp(86px,10.5vw,128px);
  height:auto;
  aspect-ratio:1;
  border-radius:50%;
  object-fit:cover;
  background:var(--surface);
  box-shadow:0 0 0 1px var(--line);
  opacity:1;
  z-index:0;
  pointer-events:none;
}
@media(max-width:860px){
  .hero{padding:72px 0 60px}
  .portrait{width:74px;opacity:.85;right:0;top:22%}
}
.eyebrow{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);margin-bottom:22px;
}
h1{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:800;
  font-size:clamp(46px,8.4vw,92px);
  line-height:.94;letter-spacing:-.035em;
  margin:0 0 18px;text-wrap:balance;
}
.role{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:400;font-size:clamp(17px,2.1vw,22px);
  color:var(--mute);margin:0 0 30px;letter-spacing:-.01em;
}
.greet{
  display:flex;align-items:baseline;gap:16px;
  padding-top:24px;border-top:1px solid var(--line);
  min-height:58px;
}
.greet-lang{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);width:104px;flex:none;
  transition:opacity .55s ease;
}
.greet-word{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:600;font-size:clamp(22px,3.4vw,32px);letter-spacing:-.02em;
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1);
}
.greet.fading .greet-lang,.greet.fading .greet-word{opacity:0}
.greet.fading .greet-word{transform:translateY(5px)}

.intro{
  margin:30px 0 0;max-width:58ch;
  font-size:17.5px;line-height:1.68;color:var(--ink);
}
.intro::first-line{font-weight:300}

/* ---------- section chrome ---------- */
section{padding:64px 0;border-top:1px solid var(--line)}
.sec-head{
  display:flex;align-items:baseline;gap:16px;margin-bottom:44px;
}
.sec-head h2{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  margin:0;
}
.sec-rule{flex:1;height:1px;background:var(--line)}
.sec-count{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:11px;color:var(--mute);letter-spacing:.08em;
}

/* ---------- projects ---------- */
.entry{
  display:grid;grid-template-columns:210px 1fr;gap:40px;
  padding:38px 0;border-top:1px solid var(--hair);
}
.entry:first-of-type{border-top:0;padding-top:0}
@media(max-width:820px){.entry{grid-template-columns:1fr;gap:14px}}
.entry-meta{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:11px;line-height:1.7;letter-spacing:.07em;
  text-transform:uppercase;color:var(--mute);
}
.entry h3{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:700;font-size:clamp(25px,3.4vw,34px);letter-spacing:-.028em;
  margin:0 0 4px;line-height:1.08;text-wrap:balance;
}
.entry .sub{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:400;color:var(--mute);font-size:16px;margin:0 0 16px;
}
.entry p.body{margin:0 0 18px;max-width:63ch}
.stack{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:12.5px;line-height:1.85;color:var(--mute);
  padding-left:16px;border-left:2px solid var(--accent-soft);
  max-width:70ch;
}
.stack b{color:var(--ink);font-weight:500}

/* ---------- links ---------- */
.links{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:22px}
.links a{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  display:inline-flex;align-items:center;gap:9px;
  border:1px solid var(--line);border-radius:999px;padding:8px 15px;
  transition:border-color .2s ease,color .2s ease,background .2s ease;
}
.links a:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.links a span[aria-hidden]{font-size:13px;line-height:1;transform:translateY(-.5px)}
.links .note{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.05em;color:var(--mute);
}

/* ---------- demo credentials ---------- */
.creds{
  margin-top:18px;max-width:520px;
  border:1px solid var(--line);border-radius:4px;overflow:hidden;
}
.creds-cap{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
  padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);
}
.creds-scroll{overflow-x:auto}
.creds table{border-collapse:collapse;width:100%;min-width:420px}
.creds td,.creds th{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:12px;text-align:left;padding:9px 14px;
  border-top:1px solid var(--hair);white-space:nowrap;
}
.creds tr:first-child td,.creds tr:first-child th{border-top:0}
.creds th{color:var(--mute);font-weight:400;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px}
.creds td:first-child{color:var(--accent)}
.creds td:last-child{font-variant-numeric:tabular-nums}

/* collapse anything emptied in the editor so it leaves no gap */
[data-field]:empty{display:none}
.entry-meta:empty,.stack:empty{display:none}

/* ---------- metrics ---------- */
.metrics{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);
  margin:26px 0;border-radius:3px;overflow:hidden;
}
@media(max-width:620px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{background:var(--ground);padding:18px 16px}
.metric .n{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-weight:700;font-size:29px;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1.1;
}
.metric .l{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mute);margin-top:6px;
}

/* ---------- chart ---------- */
figure.chart{margin:26px 0 0;max-width:520px}
figure.chart figcaption{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mute);margin-bottom:14px;
}
.bar-row{display:grid;grid-template-columns:88px 1fr 46px;align-items:center;gap:12px;margin-bottom:9px}
.bar-name{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;color:var(--mute)}
.bar-track{height:9px;background:var(--surface);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar-val{
  font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px;
  font-variant-numeric:tabular-nums;text-align:right;
}

/* ---------- about / skills / contact ---------- */
.about-grid{display:grid;grid-template-columns:210px 1fr;gap:40px}
@media(max-width:820px){.about-grid{grid-template-columns:1fr;gap:14px}}
.about-grid p{margin:0 0 16px;max-width:62ch}
.skills{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.srow{
  background:var(--ground);display:grid;grid-template-columns:150px 1fr;gap:20px;padding:15px 18px;
}
@media(max-width:620px){.srow{grid-template-columns:1fr;gap:5px}}
.srow dt{
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding-top:3px;
}
.srow dd{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:15.5px;line-height:1.6}
.contact-list{display:flex;flex-wrap:wrap;gap:12px 40px;margin-top:6px}
.contact-list a,.contact-list span{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-size:clamp(18px,2.6vw,26px);font-weight:600;letter-spacing:-.02em;
  border-bottom:2px solid var(--accent-soft);padding-bottom:2px;
}
.contact-list a:hover{border-bottom-color:var(--accent);color:var(--accent)}
footer{
  padding:40px 0 56px;border-top:1px solid var(--line);
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.08em;color:var(--mute);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
}


@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
@media print{.masthead{display:none}}
</style>

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function nl2br(s) { return esc(s).replace(/\n/g, "<br>"); }
  function get(path) {
    return path.split(".").reduce(function (o, k) {
      return o == null ? o : o[/^\d+$/.test(k) ? Number(k) : k];
    }, DATA);
  }
  function set(path, val) {
    var ks = path.split(".");
    var last = ks.pop();
    var tgt = ks.reduce(function (o, k) { return o[/^\d+$/.test(k) ? Number(k) : k]; }, DATA);
    tgt[/^\d+$/.test(last) ? Number(last) : last] = val;
  }

  /* ---------- render ---------- */
  function renderProject(p, i) {
    var h = '<article class="entry">';
    h += '<div class="entry-meta" data-field="projects.' + i + '.meta">' + nl2br(p.meta) + "</div>";
    h += "<div>";
    h += '<h3 data-field="projects.' + i + '.title">' + esc(p.title) + "</h3>";
    h += '<p class="sub" data-field="projects.' + i + '.sub">' + esc(p.sub) + "</p>";
    h += '<p class="body" data-field="projects.' + i + '.body">' + esc(p.body) + "</p>";

    if (p.metrics) {
      h += '<div class="metrics">';
      p.metrics.forEach(function (m) {
        h += '<div class="metric"><div class="n">' + esc(m.n) + '</div><div class="l">' + esc(m.l) + "</div></div>";
      });
      h += "</div>";
    }
    if (p.stack) h += '<div class="stack" data-field="projects.' + i + '.stack" data-html="1">' + p.stack + "</div>";

    if (p.chart) {
      h += '<figure class="chart"><figcaption>' + esc(p.chart.caption) + "</figcaption>";
      p.chart.bars.forEach(function (b) {
        h += '<div class="bar-row">' +
          '<div class="bar-name">' + esc(b.name) + "</div>" +
          '<div class="bar-track"><div class="bar-fill" style="width:0" data-w="' + b.v + '"></div></div>' +
          '<div class="bar-val">' + b.v.toFixed(1) + "</div></div>";
      });
      h += "</figure>";
    }

    if (p.links && p.links.length) {
      h += '<div class="links">';
      p.links.forEach(function (l) {
        h += '<a href="' + esc(l.href) + '" target="_blank" rel="noopener noreferrer">' +
          esc(l.label) + '<span aria-hidden="true">&#8599;</span></a>';
        if (l.note) h += '<span class="note">' + esc(l.note) + "</span>";
      });
      h += "</div>";
    }

    if (p.creds) {
      h += '<div class="creds"><div class="creds-cap">' + esc(p.creds.caption) + "</div>" +
        '<div class="creds-scroll"><table><tr><th>Role</th><th>Email</th><th>Password</th></tr>';
      p.creds.rows.forEach(function (r) {
        h += "<tr><td>" + esc(r.role) + "</td><td>" + esc(r.email) + "</td><td>" + esc(r.pass) + "</td></tr>";
      });
      h += "</table></div></div>";
    }

    h += "</div></article>";
    return h;
  }

  function render() {
    var h = "";

    h += '<header class="masthead"><div class="wrap">' +
      '<div class="mark">KM</div>' +
      '<nav class="mast-nav">' +
      '<a href="#work">Work</a>' +
      '<a href="#about" data-optional>About</a>' +
      '<a href="#skills" data-optional>Skills</a>' +
      '<a href="#contact">Contact</a>' +
      '<button class="ghost" type="button" id="themebtn">Theme</button>' +
      "</nav></div></header>";

    h += '<main><div class="wrap">';

    /* hero */
    h += '<div class="hero">' +
      '<img class="portrait" src="' + HEADSHOT + '" alt="" aria-hidden="true" width="360" height="360">' +
      '<div class="hero-inner">' +
      '<div class="eyebrow" data-field="location">' + esc(DATA.location) + "</div>" +
      '<h1 data-field="name">' + esc(DATA.name) + "</h1>" +
      '<p class="role" data-field="role">' + esc(DATA.role) + "</p>" +
      '<div class="greet"><div class="greet-lang" id="glang"></div><div class="greet-word" id="gword"></div></div>' +
      '<p class="intro" data-field="intro">' + esc(DATA.intro) + "</p>" +
      "</div></div>";

    /* work */
    h += '<section id="work"><div class="sec-head"><h2>Selected work</h2><div class="sec-rule"></div>' +
      '<div class="sec-count">' + DATA.projects.length + " projects</div></div>";
    DATA.projects.forEach(function (p, i) { h += renderProject(p, i); });
    h += "</section>";

    /* about */
    h += '<section id="about"><div class="sec-head"><h2>About</h2><div class="sec-rule"></div></div>' +
      '<div class="about-grid"><div class="entry-meta">Software engineer<br>Harare, Zimbabwe</div><div>';
    DATA.about.forEach(function (para, i) {
      h += '<p data-field="about.' + i + '">' + esc(para) + "</p>";
    });
    h += "</div></div></section>";

    /* skills */
    h += '<section id="skills"><div class="sec-head"><h2>Skills</h2><div class="sec-rule"></div></div><dl class="skills">';
    DATA.skills.forEach(function (s, i) {
      h += '<div class="srow"><dt data-field="skills.' + i + '.k">' + esc(s.k) + "</dt>" +
        '<dd data-field="skills.' + i + '.v">' + esc(s.v) + "</dd></div>";
    });
    h += "</dl></section>";

    /* contact */
    h += '<section id="contact"><div class="sec-head"><h2>Contact</h2><div class="sec-rule"></div></div>' +
      '<div class="contact-list">' +
      '<a href="mailto:' + esc(DATA.email) + '"><span data-field="email">' + esc(DATA.email) + "</span></a>" +
      '<a href="tel:' + esc(DATA.phone).replace(/\s/g, "") + '"><span data-field="phone">' + esc(DATA.phone) + "</span></a>" +
      "</div></section>";

    h += '<footer><div>' + esc(DATA.name) + "</div><div>Built and coded by " + esc(DATA.name) + "</div></footer>";
    h += "</div></main>";

    document.getElementById("root").innerHTML = h;
    wire();
  }

  /* ---------- behaviour ---------- */
  var greetTimer = null;

  function wire() {
    var btn = document.getElementById("themebtn");
    if (btn) btn.addEventListener("click", toggleTheme);

    /* animate bars once visible */
    var fills = document.querySelectorAll(".bar-fill");
    if (fills.length) {
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (e.isIntersecting) {
            e.target.style.width = e.target.getAttribute("data-w") + "%";
            io.unobserve(e.target);
          }
        });
      }, { threshold: .3 });
      fills.forEach(function (f) { io.observe(f); });
    }

    /* greeting cycle */
    if (greetTimer) clearInterval(greetTimer);
    var gl = document.getElementById("glang"), gw = document.getElementById("gword");
    var gwrap = gl ? gl.parentNode : null;
    if (gl && gw && gwrap) {
      var idx = 0;
      var paint = function () {
        var g = DATA.greetings[idx % DATA.greetings.length];
        gl.textContent = g.lang;
        gw.textContent = g.word;
        idx++;
      };
      paint();
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduce) {
        greetTimer = setInterval(function () {
          gwrap.classList.add("fading");
          setTimeout(function () {
            paint();
            gwrap.classList.remove("fading");
          }, 560);
        }, 4200);
      }
    }

  }

  function toggleTheme() {
    var cur = document.documentElement.getAttribute("data-theme");
    var next;
    if (cur === "dark") next = "light";
    else if (cur === "light") next = "dark";
    else next = window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("km-theme", next); } catch (e) {}
  }
  try {
    var saved = localStorage.getItem("km-theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  } catch (e) {}

  render();

})();
</script>
